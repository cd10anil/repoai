<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Code Intelligence</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html.min.js"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
        
        /* Top Navigation Bar */
        .top-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #252526; padding: 15px; border-radius: 5px; border: 1px solid #333; flex-shrink: 0;}
        .path-input { flex-grow: 1; padding: 10px; background: #3c3c3c; border: 1px solid #555; color: white; border-radius: 3px; font-family: Consolas, monospace;}
        .btn-nav { padding: 10px 20px; background-color: #007acc; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; color: white; }
        .btn-nav:disabled { background-color: #555; cursor: not-allowed; }

        /* Main Layout */
        .main-layout { display: flex; flex-grow: 1; gap: 10px; overflow: hidden; min-height: 0; }
        
        /* Sidebar File Explorer */
        .sidebar { width: 300px; min-width: 150px; background-color: #252526; border: 1px solid #333; border-radius: 5px; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;}
        .sidebar.collapsed { display: none; }
        
        .sidebar-header { background-color: #333; padding: 10px; font-weight: bold; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
        .file-list { flex-grow: 1; overflow-y: auto; padding: 10px; margin: 0; list-style: none; }
        .file-item { padding: 8px; cursor: pointer; border-radius: 3px; word-break: break-all; font-size: 0.9em; }
        .file-item:hover { background-color: #2a2d2e; }
        .file-item.selected { background-color: #04395e; border-left: 3px solid #007acc; }

        /* Highly Visible Resizer Handle */
        .resizer { 
            width: 8px; 
            min-width: 8px; 
            background-color: #1e1e1e; 
            cursor: col-resize; 
            flex-shrink: 0; 
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .resizer::after {
            content: "⋮"; /* Visual grip indicator */
            color: #666;
            font-size: 14px;
        }
        .resizer:hover, .resizer.active { background-color: #007acc; }
        .resizer:hover::after, .resizer.active::after { color: white; }

        .btn-toggle { background: none; border: none; color: #d4d4d4; cursor: pointer; font-size: 1.2em; padding: 0 5px; }
        .btn-toggle:hover { color: #ffffff; }

        /* Right Content Area */
        .content-area { flex-grow: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;}
        
        .header { background-color: #007acc; color: white; padding: 15px 20px; font-weight: bold; font-size: 1.2em; border-radius: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
        
        .action-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-shrink: 0;}
        .btn-start { background-color: #007acc; flex-grow: 1; padding: 10px 20px; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; color: white; font-size: 1.1em;}
        .btn-start:disabled { background-color: #555; cursor: not-allowed; }
        .btn-abort { background-color: #da3633; padding: 10px 20px; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; color: white; display: none; }

        .console-box { flex-grow: 1; background-color: #000; padding: 15px; border-radius: 5px; font-family: Consolas, monospace; white-space: pre-wrap; margin-bottom: 15px; border: 1px solid #333; overflow-y: auto; min-height: 0;}
        
        /* Constrained Diff2Html CSS */
        .diff-container { flex-grow: 1; background-color: #fff; border-radius: 5px; margin-bottom: 15px; display: none; color: #333; min-height: 0; overflow: hidden; }
        .d2h-wrapper { height: 100%; overflow: auto; }
        .d2h-file-wrapper { margin-bottom: 0 !important; border: none !important; }
        .d2h-file-diff { height: auto !important; }
        .d2h-code-line ct { white-space: pre !important; display: inline-block; }

        .controls { display: none; gap: 10px; background: #252526; padding: 15px; border-radius: 5px; border: 1px solid #444; flex-shrink: 0; }
        input[type="text"] { flex-grow: 1; padding: 10px; background: #3c3c3c; border: 1px solid #555; color: white; border-radius: 3px; }
        button.action-btn { padding: 10px 20px; border: none; border-radius: 3px; font-weight: bold; cursor: pointer; color: white; }
        .btn-approve { background-color: #238636; }
        .btn-modify { background-color: #d29922; }
        .btn-reject { background-color: #da3633; }
        button:hover { opacity: 0.9; }

        /* Dynamic Insights Panel */
        .insights-panel {
            background-color: #2d2d2d;
            border-left: 4px solid #007acc;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            display: none;
        }
        .insights-title { color: #569cd6; font-weight: bold; margin-bottom: 6px; font-size: 0.95em; }
        .insights-text { color: #d4d4d4; font-size: 0.9e; line-height: 1.4; }

        /* Force Diff2Html tables to drop explicit inherited scaling layouts */
        .d2h-wrapper table {
            height: auto !important;
            table-layout: fixed;
            width: 100%;
        }
        
        .d2h-file-diff { 
            height: auto !important; 
            display: block; /* Disables the flexbox vertical stretch */
        }

        .d2h-diff-table {
            height: auto !important;
        }

        /* Enforce horizontal scrolling rules cleanly */
        .d2h-code-line-ct {
            white-space: pre !important;
            display: block;
            overflow-x: auto;
        }        
    </style>
</head>
<body>

<div class="top-nav">
    <input type="text" class="path-input" id="folderPath" value="{{ default_path }}" placeholder="Enter absolute path to project folder...">
    <button class="btn-nav" id="btnLoadFolder" onclick="loadFolder()">Scan Project</button>
</div>

<div class="main-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Project Files</span>
            <button class="btn-toggle" onclick="toggleSidebar()" title="Hide Sidebar">◀</button>
        </div>
        <ul class="file-list" id="fileList">
            <li style="color: #888;">Enter a path and click Scan Project...</li>
        </ul>
    </div>

    <div class="resizer" id="resizer"></div>

    <div class="content-area">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-toggle" id="btnShowSidebar" onclick="toggleSidebar()" style="display: none;" title="Show Sidebar">☰</button>
                <span id="activeFileDisplay">Select a file to begin</span>
            </div>
            <span id="status-badge">Idle</span>
        </div>

        <div class="action-bar">
            <button class="btn-start" id="startBtn" onclick="startAnalysis()" disabled>Analyze File</button>
            <button class="btn-abort" id="abortBtn" onclick="abortAnalysis()">ABORT</button>
        </div>

        <div class="console-box" id="terminal">System Ready...</div>
        
        <div class="insights-panel" id="aiInsightsPanel">
            <div class="insights-title">💡 AI Refactoring Justification</div>
            <div class="insights-text" id="aiInsightsText">No context available.</div>
        </div>

        <div class="diff-container" id="diffBox"></div>

        <div class="controls" id="controlPanel">
            <button class="action-btn btn-approve" onclick="submitDecision('APPROVE')">Approve & Merge All</button>
            <input type="text" id="tweakInput" placeholder="Reject specific lines or tweak (e.g., 'Keep the import changes, reject the rest')...">
            <button class="action-btn btn-modify" onclick="submitDecision('MODIFY')">Submit Tweak</button>
            <button class="action-btn btn-reject" onclick="submitDecision('REJECT')">Reject All</button>
        </div>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminal');
    const diffBox = document.getElementById('diffBox');
    const controlPanel = document.getElementById('controlPanel');
    const statusBadge = document.getElementById('status-badge');
    const startBtn = document.getElementById('startBtn');
    const abortBtn = document.getElementById('abortBtn');
    const fileList = document.getElementById('fileList');
    const folderPath = document.getElementById('folderPath');
    const btnLoadFolder = document.getElementById('btnLoadFolder');
    const activeFileDisplay = document.getElementById('activeFileDisplay');
    
    let currentSelectedFile = "";
    let activeEventSource = null;
    let loadingInterval = null;
    let isPipelineRunning = false; // Tracks if analysis is active

    const loadingStatuses = [
        "Parsing Abstract Syntax Tree (AST)",
        "Analyzing variable scope and lifetime",
        "Mapping cross-module dependencies",
        "Evaluating Technical Debt Index",
        "Waking up local LLM engine",
        "Allocating VRAM for context window"
    ];

    // --- BROWSER REFRESH SAFETY LOCK ---
    window.addEventListener("beforeunload", function (e) {
        if (isPipelineRunning) {
            e.preventDefault();
            e.returnValue = "An AI analysis is currently running. If you leave, the stream will be lost.";
        }
    });

    window.onload = () => { if(folderPath.value) loadFolder(); };

    // --- SIDEBAR RESIZER LOGIC ---
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('resizer');
    const btnShowSidebar = document.getElementById('btnShowSidebar');
    const contentArea = document.querySelector('.content-area');
    let isResizing = false;

    function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            resizer.style.display = 'none';
            btnShowSidebar.style.display = 'block';
        } else {
            resizer.style.display = 'flex';
            btnShowSidebar.style.display = 'none';
        }
    }

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        contentArea.style.pointerEvents = 'none'; 
        e.preventDefault(); 
    });

    window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = e.clientX - sidebar.getBoundingClientRect().left;
        if (newWidth >= 150 && newWidth <= 800) {
            sidebar.style.width = newWidth + 'px';
            sidebar.style.flexBasis = newWidth + 'px';
        }
    });

    window.addEventListener('mouseup', () => {
        if (isResizing) {
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = 'default';
            document.body.style.userSelect = 'auto';
            contentArea.style.pointerEvents = 'auto';
        }
    });

    // --- MAIN LOGIC ---
    function loadFolder() {
        btnLoadFolder.innerText = "Scanning...";
        btnLoadFolder.disabled = true;
        
        fetch('/scan_folder', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ folder_path: folderPath.value })
        })
        .then(res => res.json())
        .then(data => {
            btnLoadFolder.innerText = "Scan Project";
            btnLoadFolder.disabled = false;
            
            if (data.status === "success") {
                fileList.innerHTML = "";
                data.files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerText = file;
                    li.onclick = () => selectFile(file, li);
                    fileList.appendChild(li);
                });
            } else {
                fileList.innerHTML = `<li style="color: red;">${data.message}</li>`;
            }
        });
    }

    function selectFile(file, liElement) {
        if (isPipelineRunning) return; // Prevent changing files mid-run

        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('selected'));
        liElement.classList.add('selected');
        
        currentSelectedFile = file;
        activeFileDisplay.innerText = "Analyzing: " + file;
        startBtn.disabled = false;
        
        terminal.style.display = 'block';
        diffBox.style.display = 'none';
        controlPanel.style.display = 'none';
        terminal.innerText = `Selected ${file}. Ready to execute agents.`;
        statusBadge.innerText = "Ready";
    }

    function writeTerminal(text, overwriteLine = false) {
        const isAtBottom = terminal.scrollHeight - terminal.clientHeight <= terminal.scrollTop + 50;
        if (overwriteLine) {
            let lines = terminal.innerText.split('\n');
            lines[lines.length - 1] = text;
            terminal.innerText = lines.join('\n');
        } else {
            terminal.innerText += text;
        }
        if (isAtBottom) terminal.scrollTop = terminal.scrollHeight;
    }

    function abortAnalysis() {
        fetch('/abort', { method: 'POST' }).then(() => {
            if(activeEventSource) {
                activeEventSource.close();
                clearInterval(loadingInterval);
                writeTerminal("\n\n[SYSTEM] Agentic workflow aborted by user.");
                statusBadge.innerText = "Aborted";
                resetUIState();
            }
        });
    }

    function resetUIState() {
        isPipelineRunning = false;
        startBtn.style.display = 'block';
        abortBtn.style.display = 'none';
        btnLoadFolder.disabled = false;
        folderPath.disabled = false;
        document.querySelectorAll('.file-item').forEach(el => el.style.pointerEvents = 'auto');
    }

    function startAnalysis(isTweak = false, feedback = "") {
        if (!currentSelectedFile) return;

        isPipelineRunning = true;
        startBtn.style.display = 'none';
        abortBtn.style.display = 'block';
        diffBox.style.display = 'none';
        controlPanel.style.display = 'none';
        btnLoadFolder.disabled = true;
        folderPath.disabled = true;
        document.querySelectorAll('.file-item').forEach(el => el.style.pointerEvents = 'none');
        
        statusBadge.innerText = isTweak ? "Refining Code..." : "Running Agents...";
        terminal.style.display = 'block';
        terminal.innerText = `[Agent 1: Discovery] Analyzing ${currentSelectedFile}...\n`;
        
        let statusIndex = 0;
        let firstTokenReceived = false;
        let ticks = 0;
        const spinnerChars = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];

        loadingInterval = setInterval(() => {
            if (firstTokenReceived) return;

            if (statusIndex < loadingStatuses.length) {
                let dotsCount = Math.floor(ticks / 5) % 4;
                writeTerminal(` -> ${loadingStatuses[statusIndex]}${".".repeat(dotsCount)}`, true);
                
                if (ticks > 0 && ticks % 20 === 0) {
                    statusIndex++;
                    writeTerminal("\n"); 
                }
            } else {
                const char = spinnerChars[ticks % spinnerChars.length];
                writeTerminal(` -> Awaiting first token from LLM... ${char}`, true);
            }
            ticks++;
        }, 100);

        let url = `/stream_analysis?file=${encodeURIComponent(currentSelectedFile)}`;
        if (isTweak) url += `&feedback=${encodeURIComponent(feedback)}`;
        
        activeEventSource = new EventSource(url);

        activeEventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.type === 'abort') {
                activeEventSource.close();
                clearInterval(loadingInterval);
                return; 
            }
            else if (data.type === 'token') {
                if (!firstTokenReceived) {
                    firstTokenReceived = true;
                    clearInterval(loadingInterval);
                    writeTerminal("\n\n -> Streaming response live from LLM...\n\n");
                }
                writeTerminal(data.content);
            } 
            else if (data.type === 'diff') {
                activeEventSource.close();
                resetUIState();
                
                terminal.style.display = 'none';
                
                // Show AI explanations if returned by backend payload, else show standard fallback
                const insightsPanel = document.getElementById('aiInsightsPanel');
                const insightsText = document.getElementById('aiInsightsText');
                if (data.justification) {
                    insightsText.innerText = data.justification;
                } else {
                    insightsText.innerText = "Refactored code structure to clean technical debt, mitigate latent security bugs, and optimize execution flow efficiency.";
                }
                insightsPanel.style.display = 'block';
                
                var diffHtml = Diff2Html.html(data.diff_string, {
                    drawFileList: false, 
                    matching: 'lines',
                    outputFormat: 'side-by-side',
                    renderNothingWhenEmpty: false
                });
                diffBox.innerHTML = diffHtml;
                
                diffBox.style.display = 'block';
                controlPanel.style.display = 'flex';
                statusBadge.innerText = "Awaiting Human Review";
                diffBox.scrollTop = 0;
            }
        };

        activeEventSource.onerror = function() {
            activeEventSource.close();
            clearInterval(loadingInterval);
            resetUIState();
            writeTerminal("\n\n[ERROR] Connection to Agentic Backend lost.");
            statusBadge.innerText = "Error";
        };
    }

    function submitDecision(action) {
        const feedback = document.getElementById('tweakInput').value;
        if (action === 'MODIFY' && feedback.trim() === "") {
            alert("Please enter a tweak request.");
            return;
        }
        if (action === 'MODIFY') {
            startAnalysis(true, feedback);
            return;
        }
        fetch('/decision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action })
        })
        .then(response => response.json())
        .then(data => {
            controlPanel.style.display = 'none';
            document.getElementById('aiInsightsPanel').style.display = 'none'; // Clear insights
            
            if (action === 'APPROVE') {
                statusBadge.innerText = "Merged";
                diffBox.style.display = 'none';
                terminal.style.display = 'block';
                
                const backupInfo = data.backup_created ? `\n[Backup] Original code preserved as: ${data.backup_created}` : '';
                writeTerminal(`\n\n[System] Changes Approved. File successfully overwritten.${backupInfo}\nBase Path: ${data.output_dir}`);
            } else {
                statusBadge.innerText = "Rejected";
                diffBox.style.display = 'none';
                terminal.style.display = 'block';
                writeTerminal(`\n\n[System] Fix Rejected. Modifications discarded.`);
            }
        });
    }
</script>
</body>
</html>
